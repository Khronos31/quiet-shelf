# SPDX-License-Identifier: GPL-2.0-only
name: torne-userland cross-platform build (public snapshot)

on:
  push:
    branches: [ci/torne-userland]
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_MINGW_URL: "https://github.com/mstorsjo/llvm-mingw/releases/download/20250910/llvm-mingw-20250910-ucrt-ubuntu-22.04-x86_64.tar.xz"
  LLVM_MINGW_SHA256: "f83556c9ffa4d4291fadea1a0776c1383332dacdf4d7fbdf974c2928cb32c6f7"

jobs:
  linux:
    name: linux / ${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - name: Check out public CI snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential make libpcsclite-dev curl

      - name: Configure
        env:
          CONFIG: ${{ matrix.config }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE="$CONFIG" -DTORNE_BUILD_TESTS=ON

      - name: Build
        env:
          CONFIG: ${{ matrix.config }}
        run: cmake --build build --config "$CONFIG" --parallel 2

      - name: CTest (no tuner hardware)
        env:
          CONFIG: ${{ matrix.config }}
        run: ctest --test-dir build -C "$CONFIG" --output-on-failure

      - name: Run three product commands
        shell: bash
        run: |
          set -euo pipefail
          for exe in torned tornectl torne-ts; do
            "./build/$exe" --version
          done

      - name: Smoke release helper from public checkout
        if: matrix.config == 'Release'
        shell: bash
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/torne-core-548"
          git init -q "$core"
          git -C "$core" fetch --depth 1 https://github.com/Khronos31/dtv-userland-core.git 548a04605d9e224be179547de30f590ff693a128
          git -C "$core" checkout --detach FETCH_HEAD
          test "$(git -C "$core" rev-parse HEAD)" = "548a04605d9e224be179547de30f590ff693a128"
          libusb="$RUNNER_TEMP/libusb-1.0.30.tar.bz2"
          curl -fsSL --retry 3 https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.tar.bz2 -o "$libusb"
          echo "fea36f34f9156400209595e300840767ab1a385ede1dc7ee893015aea9c6dbaf  $libusb" | sha256sum -c -
          output="$RUNNER_TEMP/torne-release-smoke"
          scripts/release/build-candidate.sh --output "$output" --core-source "$core" --libusb-source-archive "$libusb"
          python3 - "$output" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import tarfile
          import sys
          output = Path(sys.argv[1])
          source_archive = next(output.glob("torne-userland-*-source.tar.gz"))
          with tarfile.open(source_archive) as archive:
              member = next(m for m in archive.getmembers()
                            if m.name.endswith("/SOURCE-METADATA.json"))
              data = json.load(archive.extractfile(member))
          expected_map = hashlib.sha256(Path("SOURCE-MAP.json").read_bytes()).hexdigest()
          assert data["product_source"]["repository"] == "Khronos31/torne-userland"
          assert data["product_source"]["commit"] == "3fe17ea167fc1fff4586046d6b2a8edc02f52c4b"
          assert data["product_source"]["tree"] == "6199984391eca496abc2a5a9d26d01f9efd03264"
          assert data["checkout"]["repository"].endswith("quiet-shelf")
          assert data["checkout"]["commit"] == os.environ["GITHUB_SHA"]
          assert data["checkout"]["commit"] != data["product_source"]["commit"]
          assert data["source_map"]["sha256"] == expected_map
          print("release smoke provenance OK")
          PY

      - name: Configure PC/SC IFD stage
        env:
          CONFIG: ${{ matrix.config }}
        run: |
          cmake -S . -B build-pcsc -DCMAKE_BUILD_TYPE="$CONFIG" \
            -DTORNE_BUILD_TESTS=OFF -DTORNE_BUILD_PCSC_IFD=ON

      - name: Build PC/SC IFD stage
        env:
          CONFIG: ${{ matrix.config }}
        run: cmake --build build-pcsc --config "$CONFIG" --target torne_pcsc_stage --parallel 2

      - name: Check PC/SC IFD stage
        shell: bash
        run: |
          set -euo pipefail
          test -f build-pcsc/pcsc/unix/libdtv_userland_unix_pcsc_ifd.so
          for file in COPYING UNIX_PCSC_IFD_PROVENANCE.json LICENSE.dtv-userland-core torne.reader.conf.in; do
            test -s "build-pcsc/pcsc/unix/$file"
          done
          symbols=$(nm -D --defined-only build-pcsc/pcsc/unix/libdtv_userland_unix_pcsc_ifd.so)
          for symbol in IFDHCreateChannel IFDHCreateChannelByName IFDHCloseChannel IFDHGetCapabilities IFDHSetCapabilities IFDHSetProtocolParameters IFDHPowerICC IFDHTransmitToICC IFDHControl IFDHICCPresence; do
            if ! grep -Eq " T ${symbol}$" <<<"$symbols"; then
              echo "missing IFD ABI symbol: $symbol" >&2
              exit 1
            fi
          done

      - name: Scan dynamic dependencies
        shell: bash
        run: |
          set -euo pipefail
          for exe in torned tornectl torne-ts; do
            echo "== $exe"
            readelf -d "build/$exe" | grep NEEDED || true
            if readelf -d "build/$exe" | grep -E 'NEEDED.*(libusb|libudev)'; then
              echo "unexpected dynamic USB dependency in $exe" >&2
              exit 1
            fi
          done

  windows-cross:
    name: windows-x64 cross / ${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - name: Check out public CI snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential make curl xz-utils

      - name: Install pinned llvm-mingw UCRT toolchain
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/llvm-mingw.tar.xz"
          curl -fsSL --retry 3 "$LLVM_MINGW_URL" -o "$archive"
          echo "$LLVM_MINGW_SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$archive" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          echo "$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Configure
        env:
          CONFIG: ${{ matrix.config }}
        run: |
          cmake -S . -B build \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-clang \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-clang++ \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DCMAKE_BUILD_TYPE="$CONFIG" \
            -DTORNE_BUILD_TESTS=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static" \
            -DTORNE_BUILD_WINSCARD=ON

      - name: Build
        env:
          CONFIG: ${{ matrix.config }}
        run: cmake --build build --config "$CONFIG" --parallel 2

      - name: Build PC/SC WinSCard DLL stage
        env:
          CONFIG: ${{ matrix.config }}
        run: cmake --build build --config "$CONFIG" --target torne_pcsc_stage --parallel 2

      - name: Check PC/SC WinSCard DLL stage
        shell: bash
        run: |
          set -euo pipefail
          stage=build/pcsc/windows
          test -s "$stage/WinSCard.dll"
          for file in COPYING README.md LICENSE.dtv-userland-core COPYING.MinGW-w64-runtime.txt; do
            test -s "$stage/$file"
          done
          exports=$(x86_64-w64-mingw32-objdump -p "$stage/WinSCard.dll" |
            awk '/^Export Table:/ {in_table=1; next} in_table && /^$/ {exit} in_table && /^[[:space:]]*[0-9]+[[:space:]]+0x[0-9a-fA-F]+[[:space:]]+/ {print $NF}' |
            sort)
          expected=$(printf '%s\n' SCardConnectA SCardConnectW SCardDisconnect SCardEstablishContext SCardFreeMemory SCardGetStatusChangeW SCardIsValidContext SCardListReadersA SCardListReadersW SCardReleaseContext SCardStatusW SCardTransmit g_rgSCardT1Pci | sort)
          if [ "$exports" != "$expected" ]; then
            echo "WinSCard.dll export set mismatch" >&2
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$exports") || true
            exit 1
          fi
          imports=$(x86_64-w64-mingw32-objdump -p "$stage/WinSCard.dll" |
            awk '/DLL Name/{print $3}')
          if printf '%s\n' "$imports" | grep -E 'libusb|libstdc\+\+|libgcc|libwinpthread|libc\+\+'; then
            echo "unexpected runtime DLL import in WinSCard.dll" >&2
            exit 1
          fi

      - name: Check linked DLL imports
        shell: bash
        run: |
          set -euo pipefail
          for exe in torned tornectl torne-ts; do
            test -f "build/$exe.exe"
            echo "== $exe.exe"
            x86_64-w64-mingw32-objdump -p "build/$exe.exe" |
              awk '/DLL Name/{print $3}' | sort -u
            if x86_64-w64-mingw32-objdump -p "build/$exe.exe" |
              grep -E 'DLL Name: (libusb|libc\+\+|libgcc|libwinpthread|libstdc\+\+)'; then
              echo "unexpected bundled runtime DLL in $exe.exe" >&2
              exit 1
            fi
          done

  macos:
    name: macos / ${{ matrix.config }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - name: Check out public CI snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report toolchain
        shell: bash
        run: |
          uname -m
          clang --version | head -n 1
          cmake --version | head -n 1

      - name: Configure
        env:
          CONFIG: ${{ matrix.config }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE="$CONFIG" -DTORNE_BUILD_TESTS=ON

      - name: Build
        env:
          CONFIG: ${{ matrix.config }}
        run: cmake --build build --config "$CONFIG" --parallel 2

      - name: CTest (no tuner hardware)
        env:
          CONFIG: ${{ matrix.config }}
        run: ctest --test-dir build -C "$CONFIG" --output-on-failure

      - name: Run three product commands
        shell: bash
        run: |
          set -euo pipefail
          for exe in torned tornectl torne-ts; do
            "./build/$exe" --version
          done

      - name: Scan dynamic dependencies
        shell: bash
        run: |
          set -euo pipefail
          for exe in torned tornectl torne-ts; do
            echo "== $exe"
            otool -L "build/$exe"
            if otool -L "build/$exe" |
              grep -E 'libusb|/opt/homebrew|/usr/local/(opt|lib)'; then
              echo "unexpected non-system dependency in $exe" >&2
              exit 1
            fi
          done
