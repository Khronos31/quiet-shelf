# This public workflow does not contain or publish any private source.
# Source repo, revision and read-only credential must be configured as secrets.
name: Private source compile check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/private-build.yml

permissions:
  contents: read

jobs:
  source-gate:
    name: Check private source settings (not a build)
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.source-ready.outputs.ready }}
    steps:
      - name: Detect required repository secrets
        id: source-ready
        shell: bash
        env:
          SOURCE_REPO: ${{ secrets.CI_SOURCE_REPO }}
          SOURCE_REF: ${{ secrets.CI_SOURCE_REF }}
          SOURCE_TOKEN: ${{ secrets.CI_SOURCE_TOKEN }}
        run: |
          if [[ -n "$SOURCE_REPO" && -n "$SOURCE_REF" && -n "$SOURCE_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "A private build can be scheduled." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "NOT TESTED: missing source access configuration; build jobs will be skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: ${{ matrix.os }} / ${{ matrix.configuration }}
    needs: source-gate
    if: needs.source-gate.outputs.ready == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        configuration: [Debug, Release]

    steps:
      - name: Check out private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.CI_SOURCE_REPO }}
          ref: ${{ secrets.CI_SOURCE_REF }}
          token: ${{ secrets.CI_SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
          path: source

      - name: Install Linux USB development dependency
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq > /dev/null 2>&1
          sudo apt-get install -y -qq libusb-1.0-0-dev > /dev/null 2>&1

      # Private compiler output must not appear in public workflow logs,
      # including when the compiler emits source snippets on errors.
      # Log files remain on the ephemeral hosted runner; they are NOT
      # uploaded as public artifacts.
      - name: Configure
        shell: bash
        env:
          BUILD_TYPE: ${{ matrix.configuration }}
        run: |
          if cmake -S source -B build -DCMAKE_BUILD_TYPE="$BUILD_TYPE" > configure.log 2>&1; then
            echo "Configure: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Configure: FAIL (private details suppressed)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Build
        shell: bash
        env:
          BUILD_TYPE: ${{ matrix.configuration }}
        run: |
          if cmake --build build --config "$BUILD_TYPE" --parallel 2 > build.log 2>&1; then
            echo "Build: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Build: FAIL (private details suppressed)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Run tests without hardware
        shell: bash
        env:
          BUILD_TYPE: ${{ matrix.configuration }}
        run: |
          if ctest --test-dir build -C "$BUILD_TYPE" --output-on-failure > tests.log 2>&1; then
            echo "CTest: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CTest: FAIL (private details suppressed)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
